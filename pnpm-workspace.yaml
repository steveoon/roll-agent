packages:
  - "packages/*"
  - "agents/*"

overrides:
  "brace-expansion@1.1.13": 1.1.16
  "brace-expansion@5.0.5": 5.0.7
  hono: 4.12.25
  "js-yaml@3.14.2": 3.15.0
  "js-yaml@4.1.1": 4.3.0

shamefullyHoist: false
strictPeerDependencies: false

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - esbuild
  - "@esbuild/*"
blockExoticSubdeps: true
savePrefix: ""

allowBuilds:
  esbuild: false
  unrs-resolver: false

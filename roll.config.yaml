llm:
  default-provider: deepseek
  default-model: deepseek-v4-flash
  providers:
    openai:
      api-key: ${ANTHROPIC_API_KEY}
      base-url: https://apic1.ohmycdn.com/v1
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      base-url: https://apic1.ohmycdn.com/v1
    qwen:
      api-key: ${DASHSCOPE_API_KEY}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
ask:
  confirm-threshold: 0.5
browser:
  default-instance: boss-a
  instances:
    boss-a:
      platform: zhipin
      mode: managed-cdp
      cdp-port: 9222
      user-data-dir: ~/.roll-agent/browser/profiles/boss-a
      sessions-dir: ~/.roll-agent/browser/sessions/boss-a
      tracking-agent-id: zhipin-boss-a
    boss-b:
      platform: zhipin
      mode: managed-cdp
      cdp-port: 9223
      user-data-dir: ~/.roll-agent/browser/profiles/boss-b
      sessions-dir: ~/.roll-agent/browser/sessions/boss-b
      tracking-agent-id: zhipin-boss-b
    boss-c:
      platform: zhipin
      mode: managed-cdp
      cdp-port: 9224
      user-data-dir: ~/.roll-agent/browser/profiles/boss-c
      sessions-dir: ~/.roll-agent/browser/sessions/boss-c
      tracking-agent-id: zhipin-boss-c
agents:
  data-dir: ~/.roll-agent/agents
  env:
    smart-reply-agent:
      REPLY_AUTHORITY_URL: https://reply-authority.duliday.com
      REPLY_AUTHORITY_BEARER_TOKEN: ${REPLY_AUTHORITY_BEARER_TOKEN}
      REPLY_AUTHORITY_TIMEOUT_MS: "60000"
    notify-agent:
      FEISHU_BOT_WEBHOOK: ${FEISHU_BOT_WEBHOOK}
    browser-use-agent:
      REPLY_AUTHORITY_KEYS_URL: https://reply-authority.duliday.com/.well-known/reply-authority-keys
      BROWSER_VISUAL_CURSOR: "true"
      BROWSER_SECURITY_JSON: '{"domainAllowlist":["zhipin.com"],"maxSnapshotNodes":1000}'
      REPLY_AUTHORITY_URL: https://reply-authority.duliday.com
      REPLY_AUTHORITY_BEARER_TOKEN: ${REPLY_AUTHORITY_BEARER_TOKEN}
      RECRUITMENT_EVENTS_DEFAULT_AGENT_ID: siwen-boss-test
      RECRUITMENT_EVENTS_API_TOKEN: ${RECRUITMENT_EVENTS_API_TOKEN}
      REPLY_AUTHORITY_TIMEOUT_MS: "60000"
    reply-policy-tuner-agent:
      REPLY_AUTHORITY_URL: ${REPLY_AUTHORITY_URL}
      REPLY_AUTHORITY_BEARER_TOKEN: ${REPLY_AUTHORITY_BEARER_TOKEN}

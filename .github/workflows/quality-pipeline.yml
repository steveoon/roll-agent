name: Quality Pipeline

on:
  workflow_call:

permissions: {}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Dependency denylist
        run: pnpm verify:dependency-denylist

      - name: Security audit
        run: pnpm security:audit

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Source control-char guard
        run: pnpm check:source-control-chars

      - name: Script tests
        run: pnpm test:scripts

  unit-tests:
    name: unit-tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-1
            shard: 1/2
          - name: core-2
            shard: 2/2
          - name: runtime
            shard: ""
          - name: workspace
            shard: ""

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # Tests consume workspace source exports, so packages need not wait for dependency tests.
      # Keep every other package on the recursive path so new workspace packages are included.
      - name: Workspace unit tests
        if: matrix.name == 'workspace'
        run: pnpm --filter '!@roll-agent/core' --filter '!@roll-agent/runtime' -r run test

      - name: Runtime unit tests
        if: matrix.name == 'runtime'
        run: pnpm --filter @roll-agent/runtime test

      - name: Core unit tests
        if: startsWith(matrix.name, 'core-')
        # Node options must precede the file globs; appending --test-shard to pnpm test is ignored.
        run: >
          pnpm --filter @roll-agent/core exec node
          --experimental-strip-types --experimental-sqlite
          --test-shard=${{ matrix.shard }} --test
          "src/**/*.test.ts" "ui/**/*.test.ts"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: E2E smoke
        run: pnpm test:e2e

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build
        run: pnpm build

  chat-pty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Chat PTY harness unit tests
        run: pnpm perf:chat:test

      - name: Chat PTY correctness smoke
        id: chat-pty-smoke
        run: pnpm perf:chat:check

      - name: Upload chat PTY performance artifacts
        if: ${{ always() && (steps.chat-pty-smoke.outcome == 'success' || steps.chat-pty-smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-pty-${{ runner.os }}-${{ github.run_id }}
          path: outputs/chat-pty
          if-no-files-found: error
          retention-days: 14

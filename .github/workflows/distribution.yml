name: Standalone distribution

on:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/distribution.yml
      - scripts/distribution/**
      - packages/core/src/execution-environment/**
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to roll.duliday.com after all native checks pass
        type: boolean
        default: false
  workflow_call:
    secrets:
      ROLL_DIST_SSH_HOST:
        required: false
      ROLL_DIST_SSH_USER:
        required: false
      ROLL_DIST_SSH_KEY:
        required: false
      ROLL_DIST_SSH_KNOWN_HOSTS:
        required: false
      ROLL_DIST_SSH_PORT:
        required: false
      ROLL_DIST_ROOT:
        required: false

permissions: {}

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: win32-x64
            runner: windows-2025
          - platform: win32-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check distribution scripts
        run: node --test 'scripts/distribution/*.test.mjs'
      - name: Check activation and archive safety regressions
        run: >-
          node --experimental-strip-types --test
          packages/core/src/execution-environment/distribution.test.ts
          packages/core/src/execution-environment/windows-zip.test.ts
          packages/core/src/execution-environment/windows-install-bootstrap.test.ts packages/core/src/cli/commands/update-installer.test.ts
      - name: Build production packages
        run: pnpm --config.verify-deps-before-run=false --config.script-shell=bash --filter '@roll-agent/core...' run build
      - name: Build and test detached native distribution
        run: node scripts/distribution/build.mjs distribution-assets
      - name: Verify native A to B upgrade and npm Agent lifecycle
        if: runner.os != 'Windows'
        run: |
          archive=$(find distribution-assets -maxdepth 1 -type f | head -n 1)
          ROLL_TEST_DISTRIBUTION_ARCHIVE="$archive" node --test scripts/distribution/upgrade.test.mjs
      - name: Verify Windows PowerShell 5.1 installation and upgrade without long-path policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PolicyPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $OriginalPolicy = Get-ItemPropertyValue -LiteralPath $PolicyPath -Name LongPathsEnabled -ErrorAction SilentlyContinue
          $Node = (Get-Command node).Source
          $Archives = @(Get-ChildItem -LiteralPath distribution-assets -Filter '*.zip')
          if ($Archives.Count -ne 1) { throw 'Expected one native ZIP' }
          $env:ROLL_TEST_DISTRIBUTION_ARCHIVE = $Archives[0].FullName
          $env:ROLL_TEST_WINDOWS_INSTALLATION_RESULT = Join-Path $env:RUNNER_TEMP ('roll-install-' + [Guid]::NewGuid().ToString('N') + '.json')
          try {
            # Only this ephemeral CI runner changes policy. Each test starts fresh Node and
            # system Windows PowerShell 5.1 processes after the change; no cached policy applies.
            Set-ItemProperty -LiteralPath $PolicyPath -Name LongPathsEnabled -Type DWord -Value 0
            & $Node --test scripts/distribution/windows-installation.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Windows first-install acceptance failed' }
            & $Node --test scripts/distribution/upgrade.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Windows upgrade acceptance failed' }
          } finally {
            if ($null -eq $OriginalPolicy) {
              Remove-ItemProperty -LiteralPath $PolicyPath -Name LongPathsEnabled -ErrorAction SilentlyContinue
            } else {
              Set-ItemProperty -LiteralPath $PolicyPath -Name LongPathsEnabled -Type DWord -Value $OriginalPolicy
            }
            # Deep fixture cleanup also uses Node, never PowerShell's legacy recursive APIs.
            & $Node -e 'const fs=require("node:fs");const p=process.argv[1];if(fs.existsSync(p)){const r=JSON.parse(fs.readFileSync(p,"utf8"));fs.rmSync(r.home,{recursive:true,force:true});fs.rmSync(p);}' $env:ROLL_TEST_WINDOWS_INSTALLATION_RESULT
            if ($LASTEXITCODE -ne 0) { throw 'Windows fixture cleanup failed' }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roll-${{ matrix.platform }}
          path: distribution-assets/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: roll-*
          merge-multiple: true
          path: publication
      - name: Validate all six assets and generate publication metadata
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('packages/core/package.json')).version")
          node scripts/distribution/prepare-publication.mjs publication "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-publication
          path: publication/*
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  deploy:
    needs: assemble
    if: github.ref == 'refs/heads/main' && vars.ROLL_DISTRIBUTION_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-publication
          path: publication
      - name: Upload verified artifacts and atomically publish stable
        env:
          ROLL_DIST_SSH_HOST: ${{ secrets.ROLL_DIST_SSH_HOST }}
          ROLL_DIST_SSH_USER: ${{ secrets.ROLL_DIST_SSH_USER }}
          ROLL_DIST_SSH_KEY: ${{ secrets.ROLL_DIST_SSH_KEY }}
          ROLL_DIST_SSH_KNOWN_HOSTS: ${{ secrets.ROLL_DIST_SSH_KNOWN_HOSTS }}
          ROLL_DIST_SSH_PORT: ${{ secrets.ROLL_DIST_SSH_PORT }}
          ROLL_DIST_ROOT: ${{ secrets.ROLL_DIST_ROOT }}
        run: bash scripts/distribution/upload.sh publication

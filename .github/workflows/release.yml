name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality-pipeline.yml
    permissions:
      contents: read

  release_pr:
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release PR
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1
        with:
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}

  npm_publish:
    runs-on: ubuntu-latest
    needs: release_pr
    if: needs.release_pr.outputs.has_changesets == 'false'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # npm Trusted Publishing requires Node >= 22.14; pin 24 for bundled npm OIDC support
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages
        # Do not set NPM_TOKEN / NODE_AUTH_TOKEN; OIDC uses id-token: write.
        # Do not pass setup-node registry-url here — it writes _authToken=${NODE_AUTH_TOKEN}
        # and an empty token short-circuits Trusted Publishing.
        run: node scripts/release-packages.mjs

  github_releases:
    runs-on: ubuntu-latest
    needs: npm_publish
    if: needs.npm_publish.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Create GitHub Releases
        # Script only needs Node builtins + local files; avoid pnpm install / registry-url.
        run: node scripts/create-github-releases.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

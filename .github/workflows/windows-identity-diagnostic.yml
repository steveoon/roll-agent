name: Windows identity diagnosis
on:
  push:
    branches: [codex/windows-arm64-identity-diagnosis]
permissions: {}
jobs:
  diagnose:
    runs-on: windows-11-arm
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Original regressions with probe diagnostics
        id: original
        continue-on-error: true
        env:
          NODE_OPTIONS: --import=./scripts/identity-probe-preload.mjs
        run: |
          export NODE_OPTIONS="--import=$(node -p 'require("node:url").pathToFileURL(require("node:path").resolve("scripts/identity-probe-preload.mjs")).href')"
          node --experimental-strip-types --test packages/core/src/execution-environment/distribution.test.ts packages/core/src/execution-environment/windows-zip.test.ts packages/core/src/execution-environment/windows-install-bootstrap.test.ts packages/core/src/cli/commands/update-installer.test.ts
      - name: Isolate PowerShell startup and command execution
        if: always()
        run: node scripts/diagnose-windows-identity.mjs
      - name: Preserve original regression result
        if: always() && steps.original.outcome == 'failure'
        run: exit 1

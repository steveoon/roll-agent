name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/quality-pipeline.yml
    permissions:
      contents: read

  quality:
    if: always()
    needs: [pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify quality pipeline
        env:
          RESULT: ${{ needs.pipeline.result }}
        run: |
          echo "Quality pipeline result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            exit 1
          fi

  windows-shell-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "PowerShell 7+ is required"
          }

      - name: Targeted shell tests
        run: >
          node --experimental-strip-types --experimental-sqlite --test
          packages/runtime/src/bash/profile.test.ts
          packages/runtime/src/bash/powershell-smoke.test.ts
          packages/runtime/src/bash/powershell-session-smoke.test.ts
          packages/runtime/src/bash/format-result.test.ts
          packages/runtime/src/tool-bridge/bash-tool.test.ts
          packages/runtime/src/tool-bridge/session-exec-tool.test.ts
          packages/runtime/src/tool-bridge/skill-tool.test.ts
          packages/runtime/src/engine/agent-session.test.ts
          packages/runtime/src/engine/system-prompt.test.ts
          packages/runtime/src/engine/conversation-engine.test.ts
          packages/runtime/src/server/runtime-server.test.ts
          .claude/skills/roll-zhipin-unread-reply/scripts/reply-unread-safely.powershell.e2e.test.mjs
          packages/core/src/config/migration.test.ts
          packages/core/src/config/schema.test.ts
          packages/core/src/cli/commands/config-setup.test.ts
          packages/core/src/cli/chat/ink/display-width.test.ts
          packages/core/src/cli/chat/ink/line-buffer.test.ts
          packages/core/src/cli/chat/ink/editor-keymap.test.ts
          packages/core/src/cli/chat/ink/text-prompt.test.ts
          packages/core/src/cli/chat/ink/state.test.ts
          packages/core/src/cli/chat/ink/app.test.ts
          packages/core/src/cli/utils/current-cli-shim.test.ts
          packages/core/src/skills/library.test.ts

      - name: Scheduler unit tests
        run: >
          node --experimental-strip-types --experimental-sqlite --test
          packages/runtime/src/scheduler/schedule-store.test.ts
          packages/core/src/registry/process-identity.test.ts
          packages/core/src/scheduler-host/daemon.test.ts
          packages/core/src/scheduler-host/executor-liveness.test.ts
          packages/core/src/scheduler-host/service.test.ts
          packages/core/src/scheduler-host/stop-signals.test.ts
          packages/core/src/companion-host/service.test.ts
          packages/core/src/companion-host/identity.test.ts
          packages/core/src/companion-host/windows-system.test.ts
          packages/core/src/companion-host/windows-powershell.test.ts

      - name: Scheduler E2E smoke (diagnostic, non-blocking)
        continue-on-error: true
        timeout-minutes: 5
        run: >
          node --experimental-strip-types --experimental-sqlite --test
          packages/core/src/cli/smoke-schedule.e2e.ts

name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Dependency denylist
        run: pnpm verify:dependency-denylist

      - name: Security audit
        run: pnpm security:audit

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Unit tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: E2E smoke
        run: pnpm test:e2e

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build
        run: pnpm build

  chat-pty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Chat PTY harness unit tests
        run: pnpm perf:chat:test

      - name: Chat PTY correctness smoke
        id: chat-pty-smoke
        run: pnpm perf:chat:check

      - name: Upload chat PTY performance artifacts
        if: ${{ always() && (steps.chat-pty-smoke.outcome == 'success' || steps.chat-pty-smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-pty-${{ runner.os }}-${{ github.run_id }}
          path: outputs/chat-pty
          if-no-files-found: error
          retention-days: 14

  quality:
    if: always()
    needs: [static, unit-tests, e2e, build, chat-pty]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          status=0
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              status=1
            fi
          done
          echo "Job results: $RESULTS"
          exit "$status"

  windows-shell-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "PowerShell 7+ is required"
          }

      - name: Targeted shell tests
        run: >
          node --experimental-strip-types --experimental-sqlite --test
          packages/runtime/src/bash/profile.test.ts
          packages/runtime/src/bash/powershell-smoke.test.ts
          packages/runtime/src/bash/powershell-session-smoke.test.ts
          packages/runtime/src/bash/format-result.test.ts
          packages/runtime/src/tool-bridge/bash-tool.test.ts
          packages/runtime/src/tool-bridge/session-exec-tool.test.ts
          packages/runtime/src/tool-bridge/skill-tool.test.ts
          packages/runtime/src/engine/agent-session.test.ts
          packages/runtime/src/engine/system-prompt.test.ts
          packages/runtime/src/engine/conversation-engine.test.ts
          packages/runtime/src/server/runtime-server.test.ts
          .claude/skills/roll-zhipin-unread-reply/scripts/reply-unread-safely.powershell.e2e.test.mjs
          packages/core/src/config/migration.test.ts
          packages/core/src/config/schema.test.ts
          packages/core/src/cli/commands/config-setup.test.ts
          packages/core/src/cli/chat/ink/display-width.test.ts
          packages/core/src/cli/chat/ink/line-buffer.test.ts
          packages/core/src/cli/chat/ink/editor-keymap.test.ts
          packages/core/src/cli/chat/ink/text-prompt.test.ts
          packages/core/src/cli/chat/ink/state.test.ts
          packages/core/src/cli/chat/ink/app.test.ts
          packages/core/src/cli/utils/current-cli-shim.test.ts
          packages/core/src/skills/library.test.ts

name: CI

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/quality-pipeline.yml
    permissions:
      contents: read

  quality:
    if: always()
    needs: [pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify quality pipeline
        env:
          RESULT: ${{ needs.pipeline.result }}
        run: |
          echo "Quality pipeline result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            exit 1
          fi

  windows-shell-smoke:
    name: windows-shell-smoke (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - unit-core-runtime
          - unit-shell
          - unit-scheduler-lease
          - e2e-runtime-lease
          - e2e-workspace
          - e2e-schedule

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "PowerShell 7+ is required"
          }

      - name: Core and runtime unit regressions
        if: matrix.shard == 'unit-core-runtime'
        run: >
          node --experimental-strip-types --experimental-sqlite --test --test-concurrency=3
          packages/runtime/src/scheduler/schedule-extend.test.ts
          packages/runtime/src/scheduler/schedule-calendar.test.ts
          packages/runtime/src/scheduler/schedule-rounds.test.ts
          packages/core/src/ui/schedule-controller.test.ts
          packages/core/src/cli/chat/ink/session-picker.test.ts
          packages/core/src/config/runtime-context.test.ts
          packages/core/src/scheduler-host/config-context.test.ts
          packages/runtime/src/scheduler/host-context.test.ts
          packages/runtime/src/store/thread-store-initialization.test.ts
          packages/runtime/src/service/runtime-service.test.ts
          packages/core/src/runtime-host/workspace-identity.test.ts
          packages/core/src/runtime-host/chat-config-binding.test.ts
          packages/core/src/runtime-host/thread-model-host.test.ts
          packages/core/src/cli/chat/ink/commands.test.ts
          packages/core/src/cli/chat/session-picker-format.test.ts
          packages/core/src/cli/chat/fast-mode.test.ts
          packages/core/src/cli/chat/model-switch.test.ts
          packages/core/src/cli/commands/chat.test.ts
          packages/runtime/src/engine/conversation-workspace.test.ts
          packages/runtime/src/engine/thread-model-engine.test.ts
          packages/runtime/src/service/model-config-controller.test.ts
          packages/runtime/src/service/thread-browse.test.ts
          packages/runtime/src/ownership/session-claims.test.ts
          packages/runtime/src/store/thread-store-auto-migration.test.ts
          packages/runtime/src/store/thread-store-workspace.test.ts
          packages/protocol/src/thread-browse.test.ts
          packages/protocol/src/thread-model.test.ts
          packages/client-node/src/thread-browse.test.ts

      - name: Targeted shell tests
        if: matrix.shard == 'unit-shell'
        # PowerShell-heavy files share a runner; schedule longest suites first while bounding contention.
        run: >
          node --experimental-strip-types --experimental-sqlite --test --test-concurrency=3
          packages/core/src/cli/utils/current-cli-windows-lifecycle.test.ts
          packages/core/src/cli/utils/current-cli-windows.test.ts
          packages/core/src/cli/utils/current-cli-shim.test.ts
          .claude/skills/roll-zhipin-unread-reply/scripts/reply-unread-safely.powershell.e2e.test.mjs
          packages/runtime/src/bash/powershell-smoke.test.ts
          packages/runtime/src/bash/powershell-session-smoke.test.ts
          packages/core/src/cli/commands/config-setup.test.ts
          packages/runtime/src/bash/profile.test.ts
          packages/runtime/src/bash/format-result.test.ts
          packages/runtime/src/tool-bridge/bash-tool.test.ts
          packages/runtime/src/tool-bridge/session-exec-tool.test.ts
          packages/runtime/src/tool-bridge/skill-tool.test.ts
          packages/runtime/src/engine/agent-session.test.ts
          packages/runtime/src/engine/compactor.test.ts
          packages/runtime/src/engine/system-prompt.test.ts
          packages/runtime/src/engine/conversation-engine.test.ts
          packages/runtime/src/server/runtime-server.test.ts
          packages/core/src/config/migration.test.ts
          packages/core/src/config/schema.test.ts
          packages/core/src/cli/chat/ink/display-width.test.ts
          packages/core/src/cli/chat/ink/line-buffer.test.ts
          packages/core/src/cli/chat/ink/editor-keymap.test.ts
          packages/core/src/cli/chat/ink/text-prompt.test.ts
          packages/core/src/cli/chat/ink/state.test.ts
          packages/core/src/cli/chat/ink/app.test.ts
          packages/core/src/cli/utils/chat-renderer.test.ts
          packages/core/src/skills/library.test.ts

      - name: Scheduler and managed Agent unit tests
        if: matrix.shard == 'unit-scheduler-lease'
        run: >
          node --experimental-strip-types --experimental-sqlite --test --test-concurrency=3
          packages/core/src/registry/agent-usage-lease.test.ts
          packages/runtime/src/scheduler/schedule-store.test.ts
          packages/runtime/src/scheduler/schedule-store-probe-budget.test.ts
          packages/core/src/registry/process-identity.test.ts
          packages/core/src/mcp/client-manager.test.ts
          packages/core/src/mcp/managed-agent-connection.test.ts
          packages/core/src/scheduler-host/daemon.test.ts
          packages/core/src/scheduler-host/executor-liveness.test.ts
          packages/core/src/scheduler-host/inline-exit.test.ts
          packages/core/src/scheduler-host/cancel-descendants.test.ts
          packages/core/src/scheduler-host/daemon-record.test.ts
          packages/core/src/scheduler-host/service.test.ts
          packages/core/src/scheduler-host/service-state.test.ts
          packages/core/src/scheduler-host/service-stop.test.ts
          packages/core/src/scheduler-host/service-plan.test.ts
          packages/core/src/scheduler-host/execute-invocation.test.ts
          packages/core/src/scheduler-host/stop-signals.test.ts
          packages/core/src/companion-host/service.test.ts
          packages/core/src/companion-host/identity.test.ts
          packages/core/src/companion-host/windows-system.test.ts
          packages/core/src/companion-host/windows-powershell.test.ts

      - name: Runtime context and managed Agent E2E smoke
        if: matrix.shard == 'e2e-runtime-lease'
        timeout-minutes: 4
        run: >
          node --experimental-strip-types --experimental-sqlite --test --test-concurrency=3
          packages/core/src/cli/smoke-runtime-lease.e2e.ts
          packages/core/src/cli/smoke-reasoning-display.e2e.ts
          packages/core/src/cli/smoke-runtime-config.e2e.ts
          packages/core/src/cli/smoke-runtime-replace.e2e.ts
          packages/core/src/cli/smoke-chat-exit.e2e.ts

      - name: Chat workspace E2E smoke
        if: matrix.shard == 'e2e-workspace'
        timeout-minutes: 4
        env:
          ROLL_E2E_SUITE_CONCURRENCY: "3"
        run: >
          node --experimental-strip-types --experimental-sqlite --test --test-concurrency=2
          packages/core/src/cli/smoke-chat-workspace.e2e.ts
          packages/core/src/cli/smoke-chat-config-recovery.e2e.ts

      - name: Scheduler E2E smoke
        if: matrix.shard == 'e2e-schedule'
        timeout-minutes: 4
        run: >
          node --experimental-strip-types --experimental-sqlite --test --test-concurrency=2
          packages/core/src/cli/smoke-schedule-lifecycle.e2e.ts
          packages/core/src/cli/smoke-schedule.e2e.ts

# Include inside the EXISTING roll.duliday.com HTTPS server block.
# Keep its current Next.js location / and certificate configuration.
# expires sets cache headers without suppressing inherited server-level add_header security rules.
location = /install.sh {
    alias /var/www/roll-distribution/releases/stable/install.sh;
    default_type text/plain;
    expires -1;
}
location = /install.ps1 {
    alias /var/www/roll-distribution/releases/stable/install.ps1;
    default_type text/plain;
    expires -1;
}
location ^~ /releases/stable/ {
    alias /var/www/roll-distribution/releases/stable/;
    expires -1;
    autoindex off;
}
location ^~ /releases/ {
    alias /var/www/roll-distribution/releases/;
    expires 1y;
    autoindex off;
}

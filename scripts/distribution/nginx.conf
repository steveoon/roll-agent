# Include inside the EXISTING roll.duliday.com HTTPS server block.
# Keep its current Next.js location / and certificate configuration.
# Template only: render __ROLL_DIST_ROOT__ from private deployment configuration before use.
# expires sets cache headers without suppressing inherited server-level add_header security rules.
location = /install.sh {
    alias __ROLL_DIST_ROOT__/releases/stable/install.sh;
    default_type text/plain;
    expires -1;
}
location = /install.ps1 {
    alias __ROLL_DIST_ROOT__/releases/stable/install.ps1;
    default_type text/plain;
    expires -1;
}
location ^~ /releases/stable/ {
    alias __ROLL_DIST_ROOT__/releases/stable/;
    expires -1;
    autoindex off;
}
location ^~ /releases/ {
    alias __ROLL_DIST_ROOT__/releases/;
    expires 1y;
    autoindex off;
}

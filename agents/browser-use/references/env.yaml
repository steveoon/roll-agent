required:
  - name: REPLY_AUTHORITY_URL
    secret: false
    type: url
    purpose: Reply Authority Service API base URL；`zhipin_generate_reply_preview` 使用 SSE 直接生成并展示回复
    example: https://reply-authority.duliday.com
  - name: REPLY_AUTHORITY_BEARER_TOKEN
    secret: true
    purpose: 调用 Reply Authority Service `POST /generate-signed-reply`、读取冻结 feedback rubric 和 `POST /reply-feedback` 的 Bearer token；必须能访问目标租户并具备 `reply-feedback:write`，不会返回给 orchestrator
    example: token_xxx
  - name: REPLY_AUTHORITY_KEYS_URL
    secret: false
    type: url
    purpose: Reply Authority Service 公钥分发端点；`zhipin_send_prepared_reply` 启动预热和本地 Ed25519 验签都依赖它
    example: https://reply-authority.duliday.com/.well-known/reply-authority-keys
  - name: RECRUITMENT_EVENTS_DEFAULT_AGENT_ID
    secret: false
    purpose: 单 browser-use 实例 / 单 Boss 账号部署下的默认招聘业务 Agent ID；多 browser.instances 下仅作为实例缺少 trackingAgentId 时的 fallback；招聘事件默认启用，上报时必须有可解析归因
    example: zhipin-shanghai-kfc-001
  - name: RECRUITMENT_EVENTS_API_TOKEN
    secret: true
    purpose: 招聘事件 Open API Bearer token；公开 npm 包不内置兜底 token，必须由部署环境提供
    example: token_xxx
optional:
  - name: REPLY_FEEDBACK_OUTBOX_DB_PATH
    secret: false
    purpose: browser-use-agent 双稿 feedback SQLite outbox 路径；独立于浏览器 session，容器部署时应挂载到持久卷
    default: ~/.roll-agent/browser/reply-feedback-outbox.sqlite
    example: /data/roll-agent/reply-feedback-outbox.sqlite
  - name: REPLY_FEEDBACK_OUTBOX_RETENTION_SECONDS
    secret: false
    type: number
    purpose: feedback 临时失败后的本地最长重试时间；双稿闭环要求 Reply Authority RFC V3，实际截止时间取服务端 feedbackExpiresAt 与本值的较早者
    default: "604800"
    example: "604800"
  - name: REPLY_FEEDBACK_OUTBOX_FLUSH_INTERVAL_MS
    secret: false
    type: number
    purpose: feedback outbox 后台扫描待重试记录的间隔毫秒数
    default: "30000"
    example: "30000"
  - name: RECRUITMENT_EVENTS_ENABLED
    secret: false
    type: boolean
    purpose: 是否启用招聘事件埋点上报；未设置时默认启用，设为 `"false"` 可关闭
    default: "true"
    example: "false"
  - name: RECRUITMENT_EVENTS_API_BASE_URL
    secret: false
    type: url
    purpose: 招聘事件 Open API base URL；工具成功后会调用 `/api/v1/recruitment-events`
    default: https://huajune.duliday.com
    example: https://example.com
  - name: BROWSER_SECURITY_JSON
    secret: false
    type: json
    purpose: 浏览器安全策略 JSON；可配置 domainAllowlist、maxPageContentBytes、maxSnapshotNodes、actionPolicy、foregroundPolicy；foregroundPolicy 默认 when-minimized，无需显式配置
    default: '{"domainAllowlist":[],"maxPageContentBytes":102400,"maxSnapshotNodes":500,"actionPolicy":"log","foregroundPolicy":"when-minimized"}'
    example: '{"domainAllowlist":["zhipin.com"],"maxPageContentBytes":102400,"maxSnapshotNodes":500,"actionPolicy":"log","foregroundPolicy":"when-minimized"}'
  - name: BROWSER_USE_POLICY_JSON
    secret: false
    type: json
    purpose: browser-use 工具级业务策略 JSON；可按 exact tool name 配置 log、deny、confirm
    default: '{"approvalTtlMs":300000,"tools":{}}'
    example: '{"approvalTtlMs":300000,"tools":{"zhipin_send_prepared_reply":{"policy":"confirm"}}}'
  - name: BROWSER_PROFILE_COLOR
    secret: false
    purpose: legacy 单浏览器运行时的 Chrome profile 颜色，格式为 `#RRGGBB`；配置了 `browser.instances` 时由每个实例的 profileColor 接管，此 env 会被忽略
    example: "#2563EB"
  - name: BROWSER_INSTANCES_JSON
    secret: false
    type: json
    configurable: false
    sourcePath: [browser, instances]
    purpose: Roll core 注入的多浏览器实例声明 JSON；由 `browser.instances` 派生，包含每个实例的 profile、CDP 端口、session 目录、可选 profileName/profileColor/windowBounds 和招聘事件归因 ID；orchestrator 不应手工拼接，手工配置时必须保持 cdpPort/userDataDir 唯一
    example: '{"defaultInstance":"boss-a","instances":{"boss-a":{"platform":"zhipin","mode":"managed-cdp","cdpPort":9222,"userDataDir":"/tmp/roll-browser/profiles/boss-a","profileName":"boss-a","profileColor":"#2563EB","windowBounds":{"x":0,"y":0,"width":680,"height":1000},"trackingAgentId":"zhipin-boss-a"}}}'
  - name: BROWSER_VISUAL_CURSOR
    secret: false
    type: boolean
    purpose: 在可见浏览器页面内显示 browser-use 的页内虚拟指针和点击波纹；默认开启，设为 `"false"` 可关闭
    default: "true"
    example: "false"
  - name: BROWSER_VISUAL_ACTIVITY
    secret: false
    type: boolean
    purpose: 在消息读取、账号识别、聊天详情提取等非点击型操作期间显示页内状态胶囊、区域柔光和完成态反馈；默认开启，设为 `"false"` 可关闭
    default: "true"
    example: "true"

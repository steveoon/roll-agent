required:
  - name: REPLY_AUTHORITY_URL
    secret: false
    type: url
    purpose: Reply Authority Service 基础地址；`generate_reply` 直接转发到该服务，不再走本地 pipeline fallback
    example: https://reply-authority.duliday.com
  - name: REPLY_AUTHORITY_BEARER_TOKEN
    secret: true
    purpose: Reply Authority Service Bearer token；用于 generate-signed-reply，以及代理模式下 resolve-recruiter-binding；必须能访问目标 tenant。本 Agent 不调用 feedback rubric 或 /reply-feedback，因此自身不要求 reply-feedback:write
    example: ${REPLY_AUTHORITY_BEARER_TOKEN}
optional:
  - name: REPLY_AUTHORITY_TIMEOUT_MS
    secret: false
    type: number
    purpose: Reply Authority Service 调用方硬墙钟超时（毫秒）。未设置或值无效时回落客户端默认 60000，保持高于 RFC 当前 50000ms 的完整请求截止时间；生产仍建议显式声明以便 doctor 核验
    example: "60000"
    default: "60000"
